name: pages

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - evidence/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble public evidence site
        run: |
          mkdir -p _site/evidence
          cp -R docs/. _site/
          cp evidence/*.json evidence/*.mjs evidence/SHA256SUMS _site/evidence/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
