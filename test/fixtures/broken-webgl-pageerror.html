  <main><h1>The fallback remains visible but execution breaks</h1><p>The document keeps its semantic narrative and usable action when WebGL creation fails, yet the renderer path leaks an uncaught exception that can destabilize everything else on the page.</p><a href="/fallback">Continue with the semantic route</a><canvas id="scene" aria-hidden="true"></canvas></main>

    const context = document.querySelector('#scene').getContext('webgl');
    if (!context) setTimeout(() => { throw new Error('Unhandled renderer initialization failure'); }, 0);
    let progress=0;window.cineTraceFixture={setProgress(value){progress=value},readState(){return{progress,renderer:Boolean(context)}}};
