<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Prepared document-start fixture</title>
  <style>
    body { margin: 0; min-height: 180vh; font: 18px/1.5 system-ui; background: #f5efe2; color: #152626; }
    main { max-width: 42rem; margin: 0 auto; padding: 4rem 1rem; }
    #seed { width: 6rem; height: 6rem; margin: 2rem 0; border-radius: 50%; background: var(--seed-color); }
  </style>
</head>
<body>
  <main>
    <h1>Document-start preparation</h1>
    <p>This fixture proves that an optional adapter preparation hook can install deterministic browser state before the application scripts execute.</p>
    <div id="seed" aria-hidden="true"></div>
    <a href="#evidence">Continue to the evidence</a>
    <p id="evidence">The semantic route and primary action remain ordinary HTML with or without a project adapter.</p>
  </main>
  <script>
    const seed = Math.random();
    const preparedAtDocumentStart = window.__cinetracePrepared === true;
    document.documentElement.dataset.preparedAtDocumentStart = String(preparedAtDocumentStart);
    document.documentElement.dataset.bootSeed = String(seed);
    document.documentElement.style.setProperty('--seed-color', `hsl(${Math.floor(seed * 360)} 55% 48%)`);
    if (!preparedAtDocumentStart && matchMedia('(prefers-reduced-motion: reduce)').matches) {
      document.querySelector('#seed').animate(
        [{ transform: 'translateX(0)' }, { transform: 'translateX(120px)' }],
        { duration: 1000, iterations: Infinity },
      );
    }
  </script>
</body>
</html>
